<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift 01 • A Letter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="g1-page">
<header class="topbar"><a href="gifts.html" class="brand">← MEMORY<span>VAULT</span></a><span class="page-count">GIFT 01 / 03</span></header>
<main class="gift-main">
  <section class="letter-stage">
    <p class="eyebrow">A LITTLE LETTER</p>
    <h1>For someone special.</h1>
    <div class="envelope-wrap" id="envelopeWrap">
      <button class="envelope" id="envelope" aria-label="Open envelope">
        <span class="envelope-back"></span>
        <span class="letter-paper"><span id="letterText"></span><b class="cursor">|</b></span>
        <span class="flap"></span>
        <span class="envelope-front"></span>
      </button>
      <p class="tap-note">Tap the envelope to open</p>
    </div>
    <div class="message-controls">
      <button class="outline-btn" id="replayTyping">🔁</button>
      <a class="outline-btn" href="gifts.html">Back to gifts</a>
    </div>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
