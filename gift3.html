<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift 03 • Scratch Reveal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="g3-page">
<header class="topbar">
  <a class="brand" href="gifts.html">← MEMORY<span>VAULT</span></a>
  <span class="page-count">GIFT 03</span>
</header>

<main class="gift-main">
  <section class="scratch-stage">
    <p class="eyebrow">ONE LAST SURPRISE</p>
    <h1>Scratch the gold.<br><em>Find the secret.</em></h1>

    <div class="scratch-card" id="scratchCard">
      <div class="reveal-content">
        <img src="img/photo2.jpg" alt="Hidden memory">
        <div class="reveal-copy">
          <span>YOU FOUND IT</span>
          <h2>Some memories<br>are worth keeping.</h2>
          <p>Keep this little moment close. The best chapters are still ahead.</p>
        </div>
      </div>

      <canvas id="scratchCanvas" aria-label="Scratch to reveal"></canvas>
      <div class="scratch-cover-text" id="scratchLabel">
        <strong>SCRATCH HERE</strong>
        <small>Use your finger or mouse</small>
      </div>
    </div>


    <div class="message-controls">
      <a class="outline-btn" href="gifts.html">Back to gifts</a>
    </div>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
