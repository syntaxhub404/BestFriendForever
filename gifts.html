<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Vault • Gifts</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
<header class="topbar">
  <a class="brand" href="index.html">MEMORY<span>VAULT</span></a>
  <button class="tiny-btn" id="resetVault">Lock again</button>
</header>

<main class="home-main">
  <section class="home-hero">
    <p class="eyebrow">A LITTLE SURPRISE</p>
    <h1>Pick a box.<br><em>Make a memory.</em></h1>
    <div class="funny-quotes">
      <span>“Open it. You already know you're curious.”</span>
      <span>“Warning: excessive smiling may occur.”</span>
      <span>“Tiny box. Big feelings.”</span>
    </div>
  </section>

  <section class="gift-grid">
    <a class="gift-card" href="gift1.html" aria-label="Open gift one">
      <div class="gift-art">
        <div class="gift-floor"></div>
        <img class="real-gift-box" src="img/gift-box-final.png" alt="" aria-hidden="true">
        <div class="gift-sticker">OPEN<br>ME</div>
        <span class="sparkle sparkle-a">✦</span><span class="sparkle sparkle-b">✧</span>
      </div>
    </a>

    <a class="gift-card" href="gift2.html" aria-label="Open gift two">
      <div class="gift-art">
        <div class="gift-floor"></div>
        <img class="real-gift-box" src="img/gift-box-final.png" alt="" aria-hidden="true">
        <div class="gift-sticker">OPEN<br>ME</div>
        <span class="sparkle sparkle-a">✦</span><span class="sparkle sparkle-b">✧</span>
      </div>
    </a>

    <a class="gift-card" href="gift3.html" aria-label="Open gift three">
      <div class="gift-art">
        <div class="gift-floor"></div>
        <img class="real-gift-box" src="img/gift-box-final.png" alt="" aria-hidden="true">
        <div class="gift-sticker">OPEN<br>ME</div>
        <span class="sparkle sparkle-a">✦</span><span class="sparkle sparkle-b">✧</span>
      </div>
    </a>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
